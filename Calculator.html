<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slightly Wrong Calculator</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #e0e5ec;
        font-family: Arial, sans-serif;
        margin: 0;
    }
    .calculator {
        background-color: #2c3e50;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
        width: 280px;
    }
    #display {
        width: 100%;
        height: 60px;
        margin-bottom: 20px;
        font-size: 28px;
        text-align: right;
        padding: 10px;
        box-sizing: border-box;
        background-color: #ecf0f1;
        color: #2c3e50;
        border: none;
        border-radius: 8px;
    }
    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }
    button {
        padding: 15px;
        font-size: 20px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background-color: #ecf0f1;
        color: #2c3e50;
        transition: background-color 0.1s;
    }
    button:active {
        background-color: #bdc3c7;
        transform: scale(0.95);
    }
    .operator {
        background-color: #e67e22;
        color: white;
    }
    .operator:active {
        background-color: #d35400;
    }
    .clear {
        background-color: #e74c3c;
        color: white;
        grid-column: span 2;
    }
    .clear:active {
        background-color: #c0392b;
    }
    .equals {
        background-color: #2ecc71;
        color: white;
        grid-column: span 2;
    }
    .equals:active {
        background-color: #27ae60;
    }
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendOperator('/')">÷</button>
        <button class="operator" onclick="appendOperator('*')">×</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="appendOperator('-')">−</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="appendOperator('+')">+</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="equals" onclick="calculate()">=</button>

        <button onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendNumber('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    let currentExpression = '';

    function updateDisplay(value) {
        // Just for visual flair, replace * and / with nicer symbols
        display.value = currentExpression.replace(/\*/g, '×').replace(/\//g, '÷');
    }

    function appendNumber(number) {
        currentExpression += number;
        updateDisplay();
    }

    function appendOperator(operator) {
        const lastChar = currentExpression.slice(-1);
        if (['+', '-', '*', '/'].includes(lastChar)) {
            // Replace the last operator if the user clicks a new one
            currentExpression = currentExpression.slice(0, -1) + operator;
        } else {
            currentExpression += operator;
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentExpression = '';
        display.value = '';
    }

    function calculate() {
        try {
            // Safety check: only evaluate math characters
            if (/^[0-9+\-*/.]*$/.test(currentExpression) && currentExpression !== '') {
                
                // 1. Calculate the real answer
                let correctResult = eval(currentExpression);
                
                // 2. The secret trick: Add 1 to the final result
                let wrongResult = parseFloat(correctResult) + 1;
                
                // 3. Show the wrong answer and update the expression for chained math
                display.value = wrongResult;
                currentExpression = wrongResult.toString();
                
            }
        } catch (error) {
            display.value = 'Error';
            currentExpression = '';
        }
    }
</script>
</body>
</html>
